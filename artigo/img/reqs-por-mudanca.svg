<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="820" height="420" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Vazão Geral (Requisições/s — Mediana de 3 Execuções)</text>
  <text x="410" y="54" text-anchor="middle" font-size="12" fill="#4b5563">Fonte: arquivos resumo.txt em resultados/ (VUS=20, DURACAO=60s, SEMENTE=42)</text>

  <!-- Eixos e linhas de grade (0 a 160 req/s -> 160 req/s = 240 px -> 1.5 px por req/s) -->
  <line x1="90" y1="330" x2="780" y2="330" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="90" y1="90" x2="90" y2="330" stroke="#9ca3af" stroke-width="1.5"/>

  <g font-size="11" fill="#6b7280" text-anchor="end">
    <text x="82" y="334">0 req/s</text>
    <line x1="90" y1="270" x2="780" y2="270" stroke="#e5e7eb" stroke-dasharray="4,4"/>
    <text x="82" y="274">40 req/s</text>
    <line x1="90" y1="210" x2="780" y2="210" stroke="#e5e7eb" stroke-dasharray="4,4"/>
    <text x="82" y="214">80 req/s</text>
    <line x1="90" y1="150" x2="780" y2="150" stroke="#e5e7eb" stroke-dasharray="4,4"/>
    <text x="82" y="154">120 req/s</text>
    <line x1="90" y1="90" x2="780" y2="90" stroke="#e5e7eb" stroke-dasharray="4,4"/>
    <text x="82" y="94">160 req/s</text>
  </g>

  <!-- Barras (h = valor * 1.5, y = 330 - h):
       00-base: 2.67 -> h=4.0, y=326.0
       01-pool: 3.13 -> h=4.7, y=325.3
       02-indices: 12.84 -> h=19.3, y=310.7
       03-n+1: 12.66 -> h=19.0, y=311.0
       04-queries: 22.44 -> h=33.7, y=296.3
       05-mv: 144.74 -> h=217.1, y=112.9
       06-sem-log: 147.08 -> h=220.6, y=109.4
  -->
  <g>
    <!-- 00 -->
    <rect x="115" y="326.0" width="60" height="4.0" rx="2" fill="#dc2626"/>
    <text x="145" y="319" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">2,67</text>
    <text x="145" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">00-base</text>

    <!-- 01 -->
    <rect x="210" y="325.3" width="60" height="4.7" rx="2" fill="#ea580c"/>
    <text x="240" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">3,13</text>
    <text x="240" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">01-pool</text>

    <!-- 02 -->
    <rect x="305" y="310.7" width="60" height="19.3" rx="3" fill="#d97706"/>
    <text x="335" y="303" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">12,84</text>
    <text x="335" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">02-índices</text>

    <!-- 03 -->
    <rect x="400" y="311.0" width="60" height="19.0" rx="3" fill="#2563eb"/>
    <text x="430" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">12,66</text>
    <text x="430" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">03-fim-N+1</text>

    <!-- 04 -->
    <rect x="495" y="296.3" width="60" height="33.7" rx="3" fill="#0284c7"/>
    <text x="525" y="289" text-anchor="middle" font-size="11" font-weight="700" fill="#075985">22,44</text>
    <text x="525" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">04-queries</text>

    <!-- 05 -->
    <rect x="590" y="112.9" width="60" height="217.1" rx="4" fill="#059669"/>
    <text x="620" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">144,74</text>
    <text x="620" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">05-mv-top</text>

    <!-- 06 -->
    <rect x="685" y="109.4" width="60" height="220.6" rx="4" fill="#6b7280"/>
    <text x="715" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">147,08</text>
    <text x="715" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">06-sem-log</text>
    <text x="715" y="368" text-anchor="middle" font-size="10" fill="#6b7280">(sem ganho)</text>
  </g>
</svg>
